[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regional-medical-risk"
version = "0.1.0"
description = "메디리치: 지역 의료 접근성 분석 및 병원 폐업 시뮬레이션"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.116,<1",
  "geopandas>=1,<2",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<3",
  "plotly>=5.24,<7",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "requests>=2.32,<3",
  "scikit-learn>=1.3,<2",
  "streamlit>=1.61,<2",
  "uvicorn>=0.35,<1",
  "xgboost>=2.0,<4",
]

[project.optional-dependencies]
dev = ["httpx2>=2,<3", "pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
